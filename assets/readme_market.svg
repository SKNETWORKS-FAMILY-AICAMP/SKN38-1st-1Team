<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1044" width="1000" height="1044" role="img" aria-label="개인 단위 소형 화물 운송 시장의 변화">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .kicker { font-size: 12px; font-weight: 800; letter-spacing: 2px; fill: #4674b9; }
    .title { font-size: 30px; font-weight: 800; fill: #18212f; letter-spacing: -1px; }
    .sub { font-size: 15px; fill: #667085; }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; fill: #53729e; }
    .h3 { font-size: 18px; font-weight: 700; fill: #18212f; }
    .metric { font-size: 40px; font-weight: 800; fill: #18212f; letter-spacing: -1.5px; }
    .body { font-size: 14px; fill: #344054; }
    .muted { font-size: 13px; fill: #667085; }
    .pill { font-size: 12px; font-weight: 700; fill: #536273; }
    .boxtitle { font-size: 17px; font-weight: 700; fill: #18212f; }
    .hero { font-size: 22px; font-weight: 800; fill: #18212f; letter-spacing: -0.5px; }
    .note { font-size: 12px; fill: #8792a2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 3 L5 9 L9 3" fill="none" stroke="#8291a5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1044" rx="24" fill="#f6f8fb"/>

  <text x="40" y="64" class="kicker">JIMNI · MARKET INSIGHT</text>
  <text x="40" y="104" class="title">개인 단위 소형 화물 운송 시장의 변화</text>
  <text x="40" y="134" class="sub">1인 가구의 주거 이동과 개인 간 중고거래 확대에 따른 맞춤형 용달 매칭 수요</text>

  <!-- TREND 01 -->
  <rect x="40" y="168" width="448" height="352" rx="18" fill="#eaf2ff" stroke="#cfe0ff"/>
  <text x="68" y="206" class="eyebrow">TREND 01 · HOUSEHOLD</text>
  <text x="68" y="238" class="h3">1인 가구 증가 · 소형 주거 확산</text>
  <text x="68" y="298" class="metric">804.5만 가구</text>
  <text x="68" y="328" class="body"><tspan font-weight="700">전체 가구의 36.1%</tspan> · 2024년 기준</text>
  <text x="68" y="374" class="body">•  독립·취업·학업에 따른 개인 단위 주거 이동</text>
  <text x="68" y="402" class="body">•  원룸·오피스텔 등 소형 주거 형태</text>
  <text x="68" y="430" class="body">•  포장이사보다 소량의 짐을 옮기는 부분 운송 니즈</text>
  <rect x="68" y="462" width="160" height="30" rx="15" fill="#ffffff" stroke="#e5eaf0"/>
  <text x="148" y="482" class="pill" text-anchor="middle">소형 이사 · 부분 운송</text>

  <!-- TREND 02 -->
  <rect x="512" y="168" width="448" height="352" rx="18" fill="#eaf2ff" stroke="#cfe0ff"/>
  <text x="540" y="206" class="eyebrow">TREND 02 · C2C COMMERCE</text>
  <text x="540" y="238" class="h3">중고거래 · 빈티지 소비 활성화</text>
  <text x="540" y="298" class="metric">약 43조 원</text>
  <text x="540" y="328" class="body"><tspan font-weight="700">국내 중고거래 시장 추정 규모</tspan> · 2025년 전망치</text>
  <text x="540" y="374" class="body">•  당근 등 지역 기반 개인 간 거래 플랫폼 이용</text>
  <text x="540" y="402" class="body">•  소파·책상·의자·수납장·가전 등 부피 큰 품목</text>
  <text x="540" y="430" class="body">•  디자인을 중시하는 빈티지 가구·오디오 소비</text>
  <rect x="540" y="462" width="170" height="30" rx="15" fill="#ffffff" stroke="#e5eaf0"/>
  <text x="625" y="482" class="pill" text-anchor="middle">개인 간 대형 물품 운송</text>

  <!-- arrow -->
  <line x1="500" y1="532" x2="500" y2="564" stroke="#8291a5" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- common need -->
  <rect x="200" y="574" width="600" height="76" rx="15" fill="#ffffff" stroke="#e5eaf0"/>
  <text x="500" y="606" class="boxtitle" text-anchor="middle">개인 단위 소형·개별 화물 이동</text>
  <text x="500" y="632" class="muted" text-anchor="middle">이사 목적의 짐 이동 + 중고거래 물품의 판매자·구매자 간 이동</text>

  <line x1="500" y1="656" x2="500" y2="688" stroke="#8291a5" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- customization -->
  <rect x="120" y="696" width="760" height="110" rx="15" fill="#ffffff" stroke="#e5eaf0"/>
  <text x="500" y="730" class="boxtitle" text-anchor="middle">차량 · 비용 · 작업 조건의 맞춤화</text>
  <rect x="198" y="752" width="132" height="30" rx="15" fill="#f6f8fb" stroke="#e5eaf0"/>
  <text x="264" y="772" class="pill" text-anchor="middle">물품 크기와 수량</text>
  <rect x="340" y="752" width="84" height="30" rx="15" fill="#f6f8fb" stroke="#e5eaf0"/>
  <text x="382" y="772" class="pill" text-anchor="middle">운송 거리</text>
  <rect x="434" y="752" width="96" height="30" rx="15" fill="#f6f8fb" stroke="#e5eaf0"/>
  <text x="482" y="772" class="pill" text-anchor="middle">차량 적재량</text>
  <rect x="540" y="752" width="120" height="30" rx="15" fill="#f6f8fb" stroke="#e5eaf0"/>
  <text x="600" y="772" class="pill" text-anchor="middle">층수·엘리베이터</text>
  <rect x="670" y="752" width="132" height="30" rx="15" fill="#f6f8fb" stroke="#e5eaf0"/>
  <text x="736" y="772" class="pill" text-anchor="middle">상하차·추가 인력</text>

  <line x1="500" y1="812" x2="500" y2="844" stroke="#8291a5" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- solution -->
  <rect x="120" y="852" width="760" height="128" rx="18" fill="#e8f7ef" stroke="#bfe8d0"/>
  <text x="500" y="886" class="eyebrow" text-anchor="middle" fill="#2f7a52">JIMNI · SERVICE SOLUTION</text>
  <text x="500" y="922" class="hero" text-anchor="middle">소형 이사부터 중고거래까지, 맞춤형 용달 매칭 서비스</text>
  <text x="500" y="954" class="body" text-anchor="middle" fill="#667085">짐의 크기·수량·거리·작업 환경을 반영한 차량 추천 및 운임 산정</text>

  <text x="40" y="1014" class="note">※ 1인 가구: 국가데이터처 2024년 통계 · 중고거래 시장 규모: 2025년 전망 추정치 (공식 확정 통계 아님)</text>
</svg>
